    <script src="script.js"></script>
    <script type="module">
        import "./auth.js"; // Initialize Firebase Module
        
        document.addEventListener('DOMContentLoaded', () => {
            
            // Account Tab Logic (Separate from Main Tabs)
            const accTabBtns = document.querySelectorAll('.account-tabs .tab-btn');
            const accTabContents = document.querySelectorAll('#acc-my-uploads, #acc-saved-pdfs');
            accTabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    accTabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    accTabContents.forEach(content => content.classList.remove('active'));
                    document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
                });
            });

            // Edit Profile Toggle Logic
            const editBtn = document.getElementById('edit-profile-btn');
            const cancelEditBtn = document.getElementById('cancel-edit-btn');
            const profileForm = document.getElementById('account-form');
            const editFields = document.querySelectorAll('.edit-field');
            const actionsDiv = document.getElementById('profile-actions-div');
            const logoutDiv = document.getElementById('logout-action-div');

            const toggleEditMode = (isEditing) => {
                if (isEditing) {
                    profileForm.classList.remove('read-only');
                    editFields.forEach(field => field.disabled = false);
                    actionsDiv.style.display = 'flex';
                    logoutDiv.style.display = 'none';
                    editBtn.style.display = 'none';
                } else {
                    profileForm.classList.add('read-only');
                    editFields.forEach(field => field.disabled = true);
                    actionsDiv.style.display = 'none';
                    logoutDiv.style.display = 'flex';
                    editBtn.style.display = 'flex';
                }
            };
            
            editBtn.addEventListener('click', () => toggleEditMode(true));
            cancelEditBtn.addEventListener('click', () => toggleEditMode(false));

            // Helper to handle dynamic datalist options
            const loadCustomOptions = () => {
                ['college', 'course', 'branch'].forEach(type => {
                    const customItems = JSON.parse(localStorage.getItem(`custom_${type}s`) || '[]');
                    const datalist = document.getElementById(`${type}-options`);
                    customItems.forEach(item => {
                        if (!Array.from(datalist.options).some(opt => opt.value === item)) {
                            const option = document.createElement('option');
                            option.value = item;
                            datalist.appendChild(option);
                        }
                    });
                });
            };
            
            const saveCustomOption = (type, value) => {
                if (!value) return;
                const customItems = JSON.parse(localStorage.getItem(`custom_${type}s`) || '[]');
                const datalist = document.getElementById(`${type}-options`);
                
                if (!Array.from(datalist.options).some(opt => opt.value === value) && !customItems.includes(value)) {
                    customItems.push(value);
                    localStorage.setItem(`custom_${type}s`, JSON.stringify(customItems));
                    const option = document.createElement('option');
                    option.value = value;
                    datalist.appendChild(option);
                }
            };

            loadCustomOptions();

            const initializeAccount = async () => {
                // Wait up to 5 seconds for Firebase functions to be attached
                for (let i = 0; i < 50; i++) {
                    if (window.getUserProfile && window.getUserMaterials) break;
                    await new Promise(r => setTimeout(r, 100));
                }

                const uid = localStorage.getItem('userUid');
                if (!uid) return window.location.href = 'login.html'; // Redirect to login if not logged in

                const generateUploadSkeleton = () => Array(6).fill(`
                    <div class="upload-card" style="box-shadow: none;">
                        <div class="upload-card-header">
                            <div class="skeleton-img" style="width: 40px; height: 40px; border-radius: 8px; box-shadow: none;"></div>
                            <div style="flex: 1;">
                                <div class="skeleton-text" style="width: 70%; height: 14px; margin: 0 0 8px 0;"></div>
                                <div class="skeleton-text" style="width: 40%; height: 12px; margin: 0;"></div>
                            </div>
                        </div>
                        <div style="margin-top: 15px;">
                            <div class="skeleton-text" style="width: 100%; height: 12px; margin: 0 0 8px 0;"></div>
                            <div class="skeleton-text" style="width: 85%; height: 12px; margin: 0;"></div>
                        </div>
                        <div class="upload-actions" style="margin-top: auto; padding-top: 15px;">
                            <div class="skeleton-img" style="width: 100%; height: 36px; border-radius: 6px; box-shadow: none;"></div>
                        </div>
                    </div>
                `).join('');

                // Inject skeletons immediately to prevent empty UI during sequential async tasks
                const materialsGrid = document.getElementById('my-uploads-grid');
                if (materialsGrid) materialsGrid.innerHTML = generateUploadSkeleton();
                const savedGrid = document.getElementById('acc-saved-pdfs');
                if (savedGrid) savedGrid.innerHTML = `<div class="uploads-grid" id="saved-pdfs-grid">${generateUploadSkeleton()}</div>`;

                // Load Profile
                if (window.getUserProfile) {
                    const profile = await window.getUserProfile(uid);
                    const currentUser = window.getCurrentUser ? window.getCurrentUser() : null;
                    
                    // Fallback to Auth User if Firestore Profile is completely missing
                    const displayName = (profile && profile.name) || (currentUser && currentUser.displayName) || localStorage.getItem('userName') || 'User';
                    const displayEmail = (profile && profile.email) || (currentUser && currentUser.email) || '';

                    // Display UI
                    document.getElementById('profile-display-name').innerText = displayName;
                    document.getElementById('profile-display-email').innerText = displayEmail;
                    
                    const avatarEl = document.getElementById('profile-avatar');
                    avatarEl.innerText = displayName.charAt(0).toUpperCase();
                    avatarEl.classList.remove('skeleton-img');
                    avatarEl.style.boxShadow = '';

                    // Form fields
                    document.getElementById('acc-name').value = displayName;
                    document.getElementById('acc-email').value = displayEmail;
                    document.getElementById('acc-college').value = profile ? (profile.college || '') : '';
                    document.getElementById('acc-course').value = profile ? (profile.course || '') : '';
                    document.getElementById('acc-branch').value = profile ? (profile.branch || '') : '';
                }

                // Fetch and Load User Uploads
                if (window.getUserMaterials) {
                    
                    const materials = await window.getUserMaterials(uid);
                    
                    if (materials.length === 0) {
                        materialsGrid.innerHTML = `
                            <div class="empty-state" style="grid-column: 1/-1;">
                                <i class="fas fa-folder-open" style="font-size: 3rem; color: #94a3b8; margin-bottom: 15px;"></i>
                                <h3 style="font-size: 1.2rem; color: var(--text-dark); margin-bottom: 8px;">No Uploads Yet</h3>
                                <p style="font-size: 0.95rem; margin-bottom: 20px;">You haven't shared any study materials yet.</p>
                                <a href="https://forms.gle/zvqRWNyxxjJ1iJWq9" target="_blank" class="btn btn-blue" style="border-radius: 8px;">Upload Notes</a>
                            </div>
                        `;
                    } else {
                        materialsGrid.innerHTML = '';
                        materials.forEach(mat => {
                            const date = new Date(mat.createdAt).toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
                            
                            let iconHTML = '<div class="upload-icon"><i class="fas fa-file-pdf"></i></div>';
                            if (mat.type && mat.type.includes('PYQ')) {
                                iconHTML = '<div class="upload-icon" style="color: var(--purple-accent); background: var(--icon-bg-purple);"><i class="fas fa-file-circle-question"></i></div>';
                            }

                            const card = document.createElement('div');
                            card.className = 'upload-card';
                            card.innerHTML = `
                                <div class="upload-card-header">
                                    ${iconHTML}
                                    <div>
                                        <h3 class="upload-title">${mat.title}</h3>
                                        <div class="upload-meta">
                                            <span class="tag">${mat.type || 'Notes'}</span>
                                            <span>• ${date}</span>
                                        </div>
                                    </div>
                                </div>
                                <p class="upload-desc">${mat.description || 'No description provided.'}</p>
                                <div class="upload-actions">
                                    <a href="/notes/${mat.slug || mat.id}" target="_blank" class="btn btn-outline full-width" style="padding: 8px; font-size: 0.9rem; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-decoration: none;"><i class="fas fa-eye"></i> View</a>
                                    <button class="btn btn-outline edit-mat-btn" data-id="${mat.id}" data-title="${(mat.title || '').replace(/"/g, '&quot;')}" data-subject="${(mat.subject || '').replace(/"/g, '&quot;')}" data-type="${(mat.type || '').replace(/"/g, '&quot;')}" data-desc="${(mat.description || '').replace(/"/g, '&quot;')}" style="padding: 8px 12px; font-size: 0.9rem; border-radius: 6px;" title="Edit"><i class="fas fa-edit"></i></button>
                                    <button class="btn btn-danger delete-mat-btn" data-id="${mat.id}" data-file-url="${mat.fileUrl}" style="padding: 8px 12px; font-size: 0.9rem; border-radius: 6px;" title="Delete"><i class="fas fa-trash"></i></button>
                                </div>
                            `;
                            materialsGrid.appendChild(card);
                        });

                        // Attach edit listeners
                        document.querySelectorAll('.edit-mat-btn').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                document.getElementById('edit-doc-id').value = e.currentTarget.getAttribute('data-id');
                                document.getElementById('edit-title').value = e.currentTarget.getAttribute('data-title');
                                document.getElementById('edit-subject').value = e.currentTarget.getAttribute('data-subject');
                                document.getElementById('edit-type').value = e.currentTarget.getAttribute('data-type');
                                document.getElementById('edit-desc').value = e.currentTarget.getAttribute('data-desc');
                                document.getElementById('edit-modal-overlay').classList.add('active');
                            });
                        });

                        // Attach delete listeners
                        document.querySelectorAll('.delete-mat-btn').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                const docId = btn.getAttribute('data-id');
                                const fileUrl = btn.getAttribute('data-file-url');
                                if (await window.showConfirm('Delete Material', 'Are you sure you want to delete this material? This action cannot be undone.', true)) {
                                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                                    btn.disabled = true;
                                    try {
                                        if (window.deleteMaterialFromFirestore) {
                                            await window.deleteMaterialFromFirestore(docId, fileUrl);
                                                
                                                // Clean up local saved cache if present
                                                const uid = localStorage.getItem('userUid');
                                                if (uid) {
                                                    const savedMap = JSON.parse(localStorage.getItem(`saved_pdfs_${uid}`) || '{}');
                                                    if (savedMap[docId]) {
                                                        delete savedMap[docId];
                                                        localStorage.setItem(`saved_pdfs_${uid}`, JSON.stringify(savedMap));
                                                    }
                                                }

                                            btn.closest('.upload-card').remove();
                                            window.showToast('Material deleted successfully.', 'success');
                                            if (materialsGrid.children.length === 0) {
                                                 materialsGrid.innerHTML = `
                                                    <div class="empty-state" style="grid-column: 1/-1;">
                                                        <i class="fas fa-folder-open" style="font-size: 3rem; color: #94a3b8; margin-bottom: 15px;"></i>
                                                        <h3 style="font-size: 1.2rem; color: var(--text-dark); margin-bottom: 8px;">No Uploads Left</h3>
                                                        <p style="font-size: 0.95rem; margin-bottom: 20px;">You have deleted all your materials.</p>
                                                        <a href="https://forms.gle/zvqRWNyxxjJ1iJWq9" target="_blank" class="btn btn-blue" style="border-radius: 8px;">Upload Notes</a>
                                                    </div>
                                                `;
                                            }
                                        }
                                    } catch (error) {
                                        window.showToast('Failed to delete material. Please try again.', 'error');
                                        btn.innerHTML = '<i class="fas fa-trash"></i>';
                                        btn.disabled = false;
                                    }
                                }
                            });
                        });
                    }
                }

                // Fetch and Load Saved PDFs
                {
                    const localSavedMap = JSON.parse(localStorage.getItem(`saved_pdfs_${uid}`) || '{}');
                    const localSavedMaterials = Object.values(localSavedMap);
                    let remoteSavedMaterials = [];
                    if (window.getSavedMaterials) {
                        try {
                            remoteSavedMaterials = await window.getSavedMaterials(uid);
                        } catch (error) {
                            console.error('Failed to fetch remote saved PDFs:', error);
                        }
                    }
                    const mergedMap = {};
                    localSavedMaterials.forEach(mat => { if (mat && mat.id) mergedMap[mat.id] = mat; });
                    remoteSavedMaterials.forEach(mat => { if (mat && mat.id) mergedMap[mat.id] = { ...mergedMap[mat.id], ...mat }; });
                    const savedMaterials = Object.values(mergedMap).sort((a, b) => new Date((b.savedAt || b.createdAt || 0)) - new Date((a.savedAt || a.createdAt || 0)));
                    
                    if (savedMaterials.length === 0) {
                        savedGrid.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-bookmark" style="font-size: 3rem; color: var(--blue-accent); margin-bottom: 15px;"></i>
                                <h3 style="font-size: 1.2rem; color: var(--text-dark); margin-bottom: 8px;">No Saved PDFs Yet</h3>
                                <p style="font-size: 0.95rem; margin-bottom: 20px;">PDFs you save from cards or the viewer will appear here.</p>
                                <a href="search.html?q=Notes" class="btn btn-outline" style="border-radius: 8px;">Explore Notes</a>
                            </div>
                        `;
                    } else {
                        savedGrid.innerHTML = '<div class="uploads-grid" id="saved-pdfs-grid"></div>';
                        const gridContainer = document.getElementById('saved-pdfs-grid');
                        
                        let currentSavedIndex = 0;
                        const savedItemsPerPage = 8;
                        
                        const loadMoreSavedContainer = document.createElement('div');
                        loadMoreSavedContainer.style.gridColumn = '1/-1';
                        loadMoreSavedContainer.style.textAlign = 'center';
                        loadMoreSavedContainer.style.padding = '10px 0 20px 0';
                        const loadMoreSavedBtn = document.createElement('button');
                        loadMoreSavedBtn.className = 'btn btn-outline';
                        loadMoreSavedBtn.innerHTML = 'Load More';
                        loadMoreSavedBtn.style.borderRadius = '8px';
                        loadMoreSavedContainer.appendChild(loadMoreSavedBtn);

                        const renderSavedBatch = () => {
                            if (loadMoreSavedContainer.parentNode) {
                                gridContainer.removeChild(loadMoreSavedContainer);
                            }

                            const batch = savedMaterials.slice(currentSavedIndex, currentSavedIndex + savedItemsPerPage);

                            batch.forEach(mat => {
                                const date = new Date(mat.createdAt).toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
                                
                                let iconHTML = '<div class="upload-icon"><i class="fas fa-file-pdf"></i></div>';
                                if (mat.type && mat.type.includes('PYQ')) {
                                    iconHTML = '<div class="upload-icon" style="color: var(--purple-accent); background: var(--icon-bg-purple);"><i class="fas fa-file-circle-question"></i></div>';
                                }

                                const card = document.createElement('div');
                                card.className = 'upload-card';
                                card.innerHTML = `
                                    <div class="upload-card-header">
                                        ${iconHTML}
                                        <div>
                                            <h3 class="upload-title">${mat.title}</h3>
                                            <div class="upload-meta">
                                                <span class="tag">${mat.type || 'Notes'}</span>
                                                <span>• ${date}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <p class="upload-desc">${mat.description || 'No description provided.'}</p>
                                    <div class="upload-actions">
                                        <a href="/notes/${mat.slug || mat.id}" target="_blank" class="btn btn-outline full-width" style="padding: 8px; font-size: 0.9rem; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-decoration: none;"><i class="fas fa-eye"></i> View</a>
                                    </div>
                                `;
                                gridContainer.appendChild(card);
                            });
                            
                            currentSavedIndex += savedItemsPerPage;
                            
                            if (currentSavedIndex < savedMaterials.length) {
                                gridContainer.appendChild(loadMoreSavedContainer);
                            }
                        };
                        
                        loadMoreSavedBtn.addEventListener('click', renderSavedBatch);
                        renderSavedBatch();
                    }
                }

                // Handle Form Submit
                document.getElementById('account-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('save-btn');
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
                    
                    const data = {
                        name: document.getElementById('acc-name').value,
                        email: document.getElementById('acc-email').value,
                        college: document.getElementById('acc-college').value,
                        course: document.getElementById('acc-course').value,
                        branch: document.getElementById('acc-branch').value,
                    };

                    if (window.saveUserProfile) {
                        try {
                            await window.saveUserProfile(uid, data);
                            localStorage.setItem('userName', data.name);
                            window.showToast('Profile updated successfully!', 'success');
                            
                            // Instant UI Update without refreshing
                            document.getElementById('profile-display-name').innerText = data.name;
                            document.getElementById('profile-avatar').innerText = data.name.charAt(0).toUpperCase();
                            if (window.updateProfileUI) window.updateProfileUI(); // Updates sidebar/nav
                            
                            // Save new options to datalists if user typed them manually
                            saveCustomOption('college', data.college);
                            saveCustomOption('course', data.course);
                            saveCustomOption('branch', data.branch);
                            
                            toggleEditMode(false); // Lock fields again
                        } catch (error) {
                            console.error(error);
                            window.showToast('Failed to save changes. ' + error.message, 'error');
                        }
                    }
                    btn.innerHTML = 'Save Changes';
                });

                // Handle Edit Material Modal Form
                const editModal = document.getElementById('edit-modal-overlay');
                const closeEditModal = () => editModal.classList.remove('active');
                document.getElementById('close-edit-modal')?.addEventListener('click', closeEditModal);
                document.getElementById('cancel-edit-mat-btn')?.addEventListener('click', closeEditModal);
                
                document.getElementById('edit-material-form')?.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('submit-edit-btn');
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
                    btn.disabled = true;
                    
                    const docId = document.getElementById('edit-doc-id').value;
                    const updatedData = {
                        title: document.getElementById('edit-title').value,
                        subject: document.getElementById('edit-subject').value,
                        type: document.getElementById('edit-type').value,
                        description: document.getElementById('edit-desc').value
                    };
                    
                    if (window.updateMaterialInFirestore) {
                        try {
                            await window.updateMaterialInFirestore(docId, updatedData);
                            window.showToast('Material updated successfully!', 'success');
                            closeEditModal();
                            setTimeout(() => window.location.reload(), 1000);
                        } catch (error) {
                            console.error(error);
                            window.showToast('Failed to update material. ' + error.message, 'error');
                        }
                    }
                    btn.innerHTML = 'Save Changes';
                    btn.disabled = false;
                });

                // Handle Logout
                document.getElementById('logout-btn').addEventListener('click', async () => {
                    if (await window.showConfirm('Log Out', 'Are you sure you want to log out of your account?')) {
                        if (window.logoutUser) window.logoutUser();
                    }
                });
            };
            
            initializeAccount();
                 
        });
    </script>
</body>
</html>
